const TRUCK_COST={silica:30,iron:60,alumina:20,magnesia:6,lime:10};const GROW_COST={water:20,carbon:10};

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- world ----------
function newWorld(lv){
 const [id,name,N,seed,layout,px,py]=lv;const n=vnoise(seed),r=rng(seed*7);
 const V=N+1,h=new Int8Array(V*V);
 for(let y=0;y<V;y++)for(let x=0;x<V;x++){
  let f=n(x*.13,y*.13)*.6+n(x*.31+9,y*.31)*.3+n(x*.7,y*.7+5)*.1;
  const cx2=x/N-.5,cy2=y/N-.5;

  else if(layout==='ridge')f+=.35-Math.abs(cx2-cy2)*1.1;

  else if(layout==='bridge')f+=Math.abs(cx2)<.12&&Math.abs(cy2)>.06?-.35:0;

 // base plateau

 for(let y=by-1;y<=by+13;y++)for(let x=bx-6;x<=bx+10;x++)setH(w,x,y,bh);

 for(let y=by-1;y<=by+13;y++)for(let x=bx-6;x<=bx+10;x++)setH(w,x,y,bh);

function inV(w,x,y){return x>=0&&y>=0&&x<w.V&&y<w.V}

function smooth(w){const c=w.h.slice();for(let y=1;y<w.N;y++)for(let x=1;x<w.N;x++){let s=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)s+=c[(y+j)*w.V+x+i];w.h[y*w.V+x]=Math.round(s/9)}}
function fixAll(w){for(let k=0;k<12;k++){let ch=0;for(let y=0;y<w.V;y++)for(let x=0;x<w.V;x++){const v=w.h[y*w.V+x];for(const[dx,dy]of[[1,0],[0,1],[-1,0],[0,-1]]){if(!inV(w,x+dx,y+dy))continue;const o=w.h[(y+dy)*w.V+x+dx];if(o>v+2){w.h[(y+dy)*w.V+x+dx]=v+2;ch=1}}}if(!ch)break}}

  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;const c=a+i,e=b+j;if(!inV(w,c,e))continue;const o=w.h[e*w.V+c];
   if(d>0&&o<v-1)q.push([c,e,v-1]);if(d<0&&o>v+1)q.push([c,e,v+1]);}}

function hAt(w,fx,fy){const x=Math.floor(fx),y=Math.floor(fy),u=fx-x,v=fy-y;const a=gh(w,x,y),b=gh(w,x+1,y),c=gh(w,x,y+1),d=gh(w,x+1,y+1);return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v}

  const a=ghV(u,v),b=ghV(u+1,v),c=ghV(u,v+1),d=ghV(u+1,v+1);const pa=P(u,v),pb=P(u+1,v),pc=P(u,v+1),pd=P(u+1,v+1);
  const[wx,wy]=wt(u,v);const n0=nz[wy*N+wx]||0;const la=LV[v*V+u],lb=LV[v*V+u+1],lc=LV[(v+1)*V+u],ld=LV[(v+1)*V+u+1];

function jmove(e){const r=jE.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const d=Math.hypot(x,y);if(d>1){x/=d;y/=d}joy.x=x;joy.y=y;$('knob').style.transform=`translate(${x*26}px,${y*26}px)`}

function input(dt){let jx=joy.x+((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0),jy=joy.y+((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);

  if(held>.45&&!botAt(p.x,p.y)){gest.held=true;gest.rep-=dt;if(gest.rep<=0){gest.rep=.16;const v=nearestV(p.x,p.y);if(v&&shape(S.w,v[0],v[1],tool==='lower'?-1:1))sfx('shape')}}}}
function nearestV(sx,sy){const[x,y]=unproj(sx,sy);const vx=Math.round(x),vy=Math.round(y);return inV(S.w,vx,vy)?[vx,vy]:null}
function botAt(sx,sy){let best=null,bd=22;for(const o of S.bots){const p=sp(o.x,o.y,hAt(S.w,Math.max(0,Math.min(S.w.N-.01,o.x)),Math.max(0,Math.min(S.w.N-.01,o.y))));const d=Math.hypot(sx-p[0],sy-(p[1]-9*cam.z));if(d<bd*Math.max(1,cam.z*.8)){bd=d;best=o}}return best}
function tap(sx,sy){if(!S||S.outcome!=='playing')return;const[x,y]=unproj(sx,sy);const tx=Math.floor(x),ty=Math.floor(y);const N=S.w.N;
 if(S.arm&&S.arm.k==='road'){paintRoad(sx,sy);return}

 const o=botAt(sx,sy);if(o){if(S.sel===o){S.sel=null;tool=null}else{S.sel=o;S.selB=null;if(tool==='dig')tool=null;toast('Optimus '+o.id+' selected · tap again to cancel')}sfx('sel');return}
 if(tx<0||ty<0||tx>=N||ty>=N)return;
 if(tool==='dig'&&S.sel){const b=occ(tx,ty);if(b){toast("Can't dig under a building.");return}if(tileFlat(S.w,tx,ty)>=0&&gh(S.w,tx,ty)<=S.bh0){toast('Dig the hills down.');}
  S.sel.st='dig';S.sel.task={x:tx,y:ty};S.sel.home={x:tx+.5,y:ty+.5};S.dig={x:tx,y:ty};setTimeout(()=>S&&(S.dig=null),600);toast('Optimus '+S.sel.id+' digging.');tool=null;sfx('sel');return}
 if(tool==='raise'||tool==='lower'){const v=nearestV(sx,sy);if(v&&shape(S.w,v[0],v[1],tool==='raise'?1:-1))sfx('shape');return}
 const now=performance.now();if(now-lastTap.t<320&&Math.hypot(sx-lastTap.x,sy-lastTap.y)<30){gather(x,y);lastTap.t=0;return}lastTap={t:now,x:sx,y:sy};
 const b=occ(tx,ty);if(b&&b!==S.ship){S.selB=S.selB===b?null:b;const K=KINDS[b.kind];toast(K.name+(b.bt>0?' under construction.':b.kind==='pack'?' · battery '+Math.round(b.bat)+'%':b.kind==='solar'&&b.dust>.1?' · dusty, tap again to clean':' online.'));
  if(b.kind==='solar'&&b.dust>.1&&S.selB===null){b.dust=0;toast('Solar array clear.')}return}

 if(S.sel){S.sel=null;tool=null}else toast('Double-tap the land to summon all Optimus.')}

let AC=null,master;function aud(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
 const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
 const n=AC.createBufferSource();n.buffer=buf;n.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=AC.createGain();g.gain.value=.35;n.connect(f).connect(g).connect(master);n.start();
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=180;lfo.connect(lg).connect(f.frequency);lfo.start();
 for(const fr of[55,82.4]){const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=fr;og.gain.value=.05;o.connect(og).connect(master);o.start()}}catch(e){}}
function tone(fr,d,type='sine',v=.15,slide=0){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(fr*slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}
let sfxT={};function sfx(k){const n=performance.now();if(sfxT[k]&&n-sfxT[k]<70)return;sfxT[k]=n;
 if(k==='shape')tone(140,.12,'triangle',.12,.6);else if(k==='dig')tone(90,.15,'square',.05,.5);else if(k==='sel')tone(660,.08,'sine',.08);
 else if(k==='place')tone(330,.2,'triangle',.1,1.5);else if(k==='done'){tone(523,.25,'sine',.12);setTimeout(()=>tone(784,.35,'sine',.12),120)}
 else if(k==='night')tone(196,1.2,'sine',.1,.7);else if(k==='storm')tone(70,1.5,'sawtooth',.05,.6);else if(k==='inbound')tone(110,2.5,'sawtooth',.06,2);
 else if(k==='win'){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.6,'sine',.12),i*160))}}

const stars=Array.from({length:160},(_,i)=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.6,a:.25+Math.random()*.7,tw:.4+Math.random()*2}));let planet=null;
function mkPlanet(){const s=256,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),n=vnoise(77),im=g.createImageData(s,s);
 for(let y=0;y<s;y++)for(let x=0;x<s;x++){const u=x/s*2-1,v=y/s*2-1,r2=u*u+v*v;const i=(y*s+x)*4;if(r2>1){im.data[i+3]=0;continue}
  const zz=Math.sqrt(1-r2),f=n(u*3/(zz+.6)+4,v*3/(zz+.6))*.65+n(u*9+1,v*9)*.35;let R=138+f*92,G=58+f*48,B=28+f*22;if(Math.abs(v)>.86){R=232;G=214;B=196}
  const l=Math.max(.15,(-u*.5-v*.4+zz*.8));im.data[i]=Math.min(255,R*l);im.data[i+1]=Math.min(255,G*l);im.data[i+2]=Math.min(255,B*l);im.data[i+3]=255}g.putImageData(im,0,0);return c}
function drawTitle(t){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#07080c';cx.fillRect(0,0,W,H);for(const s of stars){cx.globalAlpha=s.a*(.55+.45*Math.sin(t*s.tw+s.x*12));cx.fillStyle='#e8e4dc';cx.beginPath();cx.arc(((s.x+t*.004)%1)*W,s.y*H,s.r,0,7);cx.fill()}cx.globalAlpha=1;
